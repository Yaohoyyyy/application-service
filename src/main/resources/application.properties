spring.application.name=application
server.port=8080
spring.jackson.serialization.indent-output=true
logging.level.org.springframework.web=DEBUG

# gRPC (native Netty, параллельно REST). Браузер ходит через Envoy: envoy.yaml -> 9090.
spring.grpc.server.port=9090
spring.grpc.server.reflection.enabled=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
# SQL
spring.jpa.show-sql=true
# SQL
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# MongoDB
spring.mongodb.uri = mongodb://localhost:27017/shop_db

# Внешний сервис юр.лиц (POST/GET проксируются сюда + /jur)
app.external.jur.base-url=http://localhost:8089

# Hazelcast (клиент к docker-контейнеру hazelcast:5.7.0)
app.hazelcast.address=localhost:5701
app.hazelcast.cluster-name=dev
# Время жизни кеша /vendor в Hazelcast (секунды)
app.vendor.cache.ttl-seconds=30

# AsyncAPI (Springwolf)
springwolf.docket.base-package=com.application
springwolf.docket.info.title=${spring.application.name}
springwolf.docket.info.version=1.0.0
springwolf.docket.servers.kafka-server.protocol=kafka
springwolf.docket.servers.kafka-server.host=${spring.kafka.bootstrap-servers}
springwolf.plugin.kafka.publishing.enabled=false